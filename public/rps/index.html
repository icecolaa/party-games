<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>石头剪刀布</title>
<style>
:root { --panel:#1a2233; --panel2:#232d42; --line:rgba(255,255,255,.1); --text:#e8ecf3; --dim:#93a0b8; --accent:#f0b429; --win:#5ad07f; --lose:#e05252; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:radial-gradient(900px 500px at 20% -10%, #2b2050 0%, transparent 60%), linear-gradient(160deg,#141a28,#0d1220); color:var(--text); min-height:100dvh; display:flex; justify-content:center; padding:18px 14px; padding-top:calc(18px + env(safe-area-inset-top)); user-select:none; -webkit-user-select:none; }
#app { width:100%; max-width:560px; display:flex; flex-direction:column; gap:14px; }
header { text-align:center; }
header h1 { font-size:22px; letter-spacing:2px; }
header .sub { color:var(--dim); font-size:12.5px; margin-top:4px; }
.scorebar { display:flex; justify-content:center; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
.scorebar .side { text-align:center; flex:1; }
.scorebar .name { font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scorebar .num { font-size:32px; font-weight:800; }
.scorebar .mid { color:var(--dim); font-size:12px; text-align:center; }
.arena { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px; min-height:150px; justify-content:center; }
.arena .hands { display:flex; gap:26px; align-items:center; font-size:56px; }
.arena .hands .vs { color:var(--dim); font-size:16px; }
.arena .msg { font-size:15px; font-weight:700; min-height:22px; }
.arena .msg.win { color:var(--win); } .arena .msg.lose { color:var(--lose); }
.choices { display:flex; gap:10px; }
.choices button { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:14px; padding:14px 0 10px; font-size:13px; cursor:pointer; }
.choices button .ic { display:block; font-size:34px; margin-bottom:4px; }
.choices button:active { transform:scale(.96); background:var(--panel2); }
.hidden { display:none !important; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; }
.panel h2 { font-size:16px; text-align:center; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:11px 0; border-radius:10px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); font-size:13.5px; cursor:pointer; }
.seg button.active { border-color:var(--accent); color:var(--accent); background:rgba(240,180,41,.14); font-weight:700; }
input { width:100%; padding:11px 12px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--text); font-size:15px; font-family:inherit; }
label { font-size:12.5px; color:var(--dim); display:block; margin-bottom:6px; }
.primary { background:linear-gradient(180deg,#f5c453,#e0a418); color:#23180a; font-weight:700; padding:12px; border:none; border-radius:10px; font-size:15px; cursor:pointer; width:100%; }
.note { color:var(--dim); font-size:12px; line-height:1.6; text-align:center; }
#toast { position:fixed; left:50%; bottom:12%; transform:translateX(-50%); background:rgba(0,0,0,.88); padding:10px 18px; border-radius:10px; font-size:13.5px; opacity:0; transition:.2s; pointer-events:none; z-index:9; }
#toast.show { opacity:1; }
/* ---- 图文规则弹窗（统一风格） ---- */
.rules-ov{position:fixed;inset:0;z-index:90;background:rgba(6,10,18,.88);display:flex;align-items:center;justify-content:center;padding:18px}
.rules-ov.hidden{display:none}
.rules-p{background:var(--panel,#1a2233);border:1px solid var(--line,rgba(255,255,255,.1));border-radius:16px;padding:16px 16px 14px;width:100%;max-width:430px;max-height:calc(100dvh - 40px);overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.rules-p h2{font-size:17px;text-align:center;letter-spacing:1px;margin:0 0 2px}
.rules-sub{color:var(--dim,#93a0b8);font-size:12px;text-align:center;margin-bottom:10px}
.r-sec{margin-bottom:11px}
.r-sec h3{font-size:13px;color:var(--accent,#f0b429);margin:0 0 5px}
.r-art{background:rgba(0,0,0,.25);border:1px solid var(--line,rgba(255,255,255,.1));border-radius:10px;padding:9px;margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;font-size:19px;line-height:1.35}
.r-sec p{font-size:12.5px;line-height:1.7;margin:0}
.r-sec p b{color:var(--accent,#f0b429)}
.r-lad{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.r-lad .lv{background:rgba(255,255,255,.1);border:1px solid var(--line,rgba(255,255,255,.1));border-radius:6px;padding:2px 7px}
.r-chip{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid}
.r-chip.r{color:#b02a1e;background:linear-gradient(160deg,#fff,#f0d9b5);border-color:#b02a1e}
.r-chip.b{color:#1a3a6b;background:linear-gradient(160deg,#fff,#d5e2f0);border-color:#1a3a6b}
.r-card{display:inline-flex;flex-direction:column;align-items:center;min-width:24px;padding:2px 5px;border-radius:4px;background:#fdfdfd;color:#1a1a1a;font-size:12px;font-weight:800;line-height:1.15;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.r-card.red{color:#d02b2b}
.r-tile{display:inline-flex;flex-direction:column;align-items:center;min-width:22px;padding:2px 4px;border-radius:4px;background:linear-gradient(160deg,#fdfdfd,#e6e0d0);font-size:12px;font-weight:800;line-height:1.1;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.r-arrow{color:var(--dim,#93a0b8);font-size:14px}
.rules-close{width:100%;padding:11px;border-radius:10px;background:linear-gradient(180deg,#f5c453,#e0a418);color:#23180a;font-weight:700;border:none;font-size:14px;cursor:pointer;margin-top:2px}
.rq{width:30px;height:30px;border-radius:50%;background:var(--panel2,#232d42);border:1px solid var(--line,rgba(255,255,255,.1));color:var(--accent,#f0b429);font-weight:800;font-size:15px;cursor:pointer;flex:0 0 auto}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="rq" id="rulesOpen" title="玩法说明" style="position:absolute;right:12px;top:10px;">?</button><h1>✊ 石头剪刀布</h1>
    <p class="sub">先赢 <span id="targetText">3</span> 局获胜</p>
  </header>

  <div class="scorebar">
    <div class="side"><div class="name" id="name1">你</div><div class="num" id="score1">0</div></div>
    <div class="mid">VS<br><span id="roundNo">第 1 局</span></div>
    <div class="side"><div class="name" id="name2">AI</div><div class="num" id="score2">0</div></div>
  </div>

  <div class="arena">
    <div class="hands"><span id="hand1">❔</span><span class="vs">VS</span><span id="hand2">❔</span></div>
    <div class="msg" id="msg">选择你的手势开始！</div>
  </div>

  <div class="choices" id="p1Choices">
    <button data-h="0"><span class="ic">✊</span>石头</button>
    <button data-h="1"><span class="ic">✌️</span>剪刀</button>
    <button data-h="2"><span class="ic">✋</span>布</button>
  </div>

  <!-- 设置 -->
  <div class="panel" id="setup">
    <h2>游戏模式</h2>
    <div class="seg">
      <button id="modeAi" class="active">🤖 人机对战</button>
      <button id="modeHot">👥 双人热座</button>
    </div>
    <div><label>玩家 1 昵称</label><input id="p1Name" maxlength="10" value="你"></div>
    <div id="p2Field" class="hidden"><label>玩家 2 昵称</label><input id="p2Name" maxlength="10" value="TA"></div>
    <div><label>目标胜局</label>
      <div class="seg" id="targetSeg">
        <button data-t="1">1 局</button>
        <button data-t="3" class="active">3 局</button>
        <button data-t="5">5 局</button>
      </div>
    </div>
    <button id="startBtn" class="primary">开始游戏</button>
  </div>

  <div class="hidden" id="endBar" style="display:flex; gap:10px;">
    <button id="againBtn" class="primary" style="flex:1;">再来一局</button>
    <button id="backBtn" class="primary" style="flex:1; background:var(--panel2); color:var(--text);">返回设置</button>
  </div>

  <p class="note">石头 ✊ 砸剪刀 ✌️ · 剪刀 ✌️ 剪布 ✋ · 布 ✋ 包石头 ✊</p>
</div>
<div id="toast"></div>
<script src="js/rps-core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.RpsCore;
  var $ = function (id) { return document.getElementById(id); };
  var S = { mode: 'ai', target: 3, s1: 0, s2: 0, round: 1, history: [], turn: 1, p1Pick: null, over: false, playing: false };

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 1800); }
  function icon(h) { return C.ICONS[h]; }

  function reset() {
    S.s1 = 0; S.s2 = 0; S.round = 1; S.history = []; S.turn = 1; S.over = false; S.playing = false;
    render();
  }
  function render() {
    $('score1').textContent = S.s1;
    $('score2').textContent = S.s2;
    $('roundNo').textContent = '第 ' + S.round + ' 局';
    $('name1').textContent = $('p1Name').value.trim().slice(0, 10) || '玩家1';
    $('name2').textContent = S.mode === 'ai' ? 'AI' : ($('p2Name').value.trim().slice(0, 10) || '玩家2');
    $('targetText').textContent = S.target;
  }
  function setMsg(text, cls) { $('msg').textContent = text; $('msg').className = 'msg' + (cls ? ' ' + cls : ''); }

  /* 一局结算 */
  function settleRound(p1, p2) {
    $('hand1').textContent = icon(p1);
    $('hand2').textContent = icon(p2);
    var r = C.judge(p1, p2);
    if (r === 1) { S.s1++; setMsg(($('name1').textContent) + ' 赢了这一局！', 'win'); }
    else if (r === -1) { S.s2++; setMsg(($('name2').textContent) + ' 赢了这一局', 'lose'); }
    else setMsg('平局，再来！', '');
    var w = C.seriesWinner(S.s1, S.s2, S.target);
    if (w) {
      S.over = true;
      var name = w === 'p1' ? $('name1').textContent : $('name2').textContent;
      setMsg('🎉 ' + name + ' 获胜！（' + S.s1 + ' : ' + S.s2 + '）', 'win');
      $('endBar').classList.remove('hidden');
      $('p1Choices').classList.add('hidden');
    } else {
      S.round++;
      if (S.mode === 'hot') setTurn(2);
    }
    render();
    S.playing = false;
  }

  function aiPick() { return C.decide(S.history.filter(function (_, i) { return i % 2 === 0; }), 'hard'); }

  function playerPick(h) {
    if (S.over || S.playing) return;
    S.playing = true;
    $('hand1').textContent = '❔'; $('hand2').textContent = '❔';
    if (S.mode === 'ai') {
      setMsg('AI 思考中…', '');
      setTimeout(function () {
        var a = aiPick();
        S.history.push(h);
        settleRound(h, a);
      }, 450);
    } else if (S.turn === 1) {
      S.p1Pick = h;
      $('hand1').textContent = '🔒';
      setMsg(($('name1').textContent) + ' 已选定，把设备交给 ' + ($('name2').textContent));
      setTurn(2);
      S.playing = false;
    } else {
      $('hand2').textContent = '🔒';
      setTimeout(function () { settleRound(S.p1Pick, h); }, 350);
    }
  }
  function setTurn(t) {
    S.turn = t;
    var hint = t === 1 ? ($('name1').textContent + ' 出手势') : ($('name2').textContent + ' 出手势');
    if (S.mode === 'hot' && !S.over) $('msg').textContent = hint;
  }

  /* 绑定 */
  document.querySelectorAll('#p1Choices button').forEach(function (b) {
    b.addEventListener('click', function () { playerPick(Number(b.dataset.h)); });
  });
  $('modeAi').addEventListener('click', function () { S.mode = 'ai'; $('modeAi').classList.add('active'); $('modeHot').classList.remove('active'); $('p2Field').classList.add('hidden'); });
  $('modeHot').addEventListener('click', function () { S.mode = 'hot'; $('modeHot').classList.add('active'); $('modeAi').classList.remove('active'); $('p2Field').classList.remove('hidden'); });
  document.querySelectorAll('#targetSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#targetSeg button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      S.target = Number(b.dataset.t);
    });
  });
  $('p1Name').addEventListener('input', render);
  $('p2Name').addEventListener('input', render);
  $('startBtn').addEventListener('click', function () {
    reset();
    $('setup').classList.add('hidden');
    $('endBar').classList.add('hidden');
    $('p1Choices').classList.remove('hidden');
    $('hand1').textContent = '❔'; $('hand2').textContent = '❔';
    setMsg('选择你的手势开始！', '');
  });
  $('againBtn').addEventListener('click', function () { $('startBtn').click(); });
  $('backBtn').addEventListener('click', function () {
    $('setup').classList.remove('hidden');
    $('endBar').classList.add('hidden');
    $('p1Choices').classList.add('hidden');
    $('hand1').textContent = '❔'; $('hand2').textContent = '❔';
    setMsg('选择你的手势开始！', '');
  });
  render();
})();
</script>

<!-- 图文规则弹窗 -->
<div class="rules-ov hidden" id="rulesOv">
  <div class="rules-p">

<h2>✌️ 石头剪刀布玩法</h2>
<div class="rules-sub">最简单也最刺激 · 人机或双人热座</div>
<div class="r-sec"><h3>🎯 克制关系</h3>
 <div class="r-art"><span>✊ 石头</span><span class="r-arrow">砸</span><span>✌️ 剪刀</span><span class="r-arrow">剪</span><span>✋ 布</span><span class="r-arrow">包</span><span>✊ 石头</span></div>
 <p>每局双方同时出手势，赢方计 1 分，可选 <b>1 / 3 / 5 局</b>先到者胜。双人热座时出过的手会 🔒 锁定，把设备交给对方再出。</p>
</div>
<div class="r-sec"><h3>🤖 小心 AI</h3>
 <p>人机模式的 AI 会<b>统计你最近 8 手</b>的出招倾向，专门出克制你的手——别太有规律！</p>
</div>

    <button class="rules-close" id="rulesOvClose">知道了，开玩！</button>
  </div>
</div>

<script>
(function () {
  var ov = document.getElementById('rulesOv');
  if (!ov) return;
  var btn = document.getElementById('rulesOpen') || document.getElementById('rulesBtn');
  if (btn) btn.addEventListener('click', function () { ov.classList.remove('hidden'); });
  document.getElementById('rulesOvClose').addEventListener('click', function () { ov.classList.add('hidden'); });
  ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.add('hidden'); });
})();
</script>

<script src="/nav.js"></script>
</body>
</html>
