<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>青花麻将</title>
<style>
:root { --panel:#1a2233; --panel2:#232d42; --line:rgba(255,255,255,.1); --text:#e8ecf3; --dim:#93a0b8; --accent:#f0b429; --win:#5ad07f; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:linear-gradient(160deg,#141a28,#0d1220); color:var(--text); min-height:100dvh; display:flex; justify-content:center; padding:12px; padding-top:calc(12px + env(safe-area-inset-top)); user-select:none; -webkit-user-select:none; }
#app { width:100%; max-width:720px; display:flex; flex-direction:column; gap:10px; }
header { display:flex; align-items:center; gap:10px; }
header h1 { font-size:18px; letter-spacing:1px; }
header .info { margin-left:auto; font-size:12px; color:var(--dim); }
.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:6px 10px; font-size:12.5px; cursor:pointer; }
main { position:relative; background:radial-gradient(120% 100% at 50% 0%, #23304d 0%, #1a2233 100%); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; }
.seatrow { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.seat { display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; }
.seat.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(240,180,41,.3); }
.seat .score { color:var(--accent); font-weight:700; }
.seat .melds { font-size:11px; color:var(--dim); }
#pool { min-height:44px; background:rgba(0,0,0,.22); border-radius:9px; padding:6px; display:flex; flex-wrap:wrap; gap:3px; align-content:flex-start; }
.discard { font-size:13px; background:#fdfdfd; color:#222; border-radius:4px; padding:2px 5px; font-weight:600; }
#claimBar { display:flex; gap:8px; justify-content:center; min-height:0; }
#claimBar button { padding:10px 22px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px; font-weight:700; cursor:pointer; }
#claimBar button.hu { background:linear-gradient(180deg,#f5c453,#e0a418); color:#23180a; border:none; }
footer { background:#141b29; border:1px solid var(--line); border-radius:14px; padding:10px; }
#hand { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; min-height:64px; }
.tile { width:42px; height:58px; border-radius:6px; background:linear-gradient(160deg,#fdfdfd,#e6e0d0); color:#1a1a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; box-shadow:0 2px 5px rgba(0,0,0,.4); cursor:pointer; transition:transform .1s; }
.tile .r { font-size:18px; line-height:1; } .tile .s { font-size:11px; opacity:.75; }
.tile.m { color:#c0392b; } .tile.p { color:#2471a3; } .tile.s { color:#1e8449; }
.tile.drawn { box-shadow:0 0 0 2px var(--accent), 0 2px 5px rgba(0,0,0,.4); margin-left:8px; }
.tile.can-act { animation:pulse 1.2s ease infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 3px rgba(240,180,41,.7); } }
#actionBar { display:flex; gap:8px; margin-top:8px; min-height:0; }
#actionBar button { flex:1; padding:11px 0; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px; font-weight:700; cursor:pointer; }
#actionBar button.play { background:linear-gradient(180deg,#f5c453,#e0a418); color:#23180a; border:none; }
#actionBar button:disabled { opacity:.35; }
.overlay { position:fixed; inset:0; z-index:50; background:rgba(6,10,18,.88); display:flex; align-items:center; justify-content:center; padding:18px; }
.overlay.hidden { display:none; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px; max-height:calc(100dvh - 40px); overflow-y:auto; }
.panel h2 { font-size:18px; text-align:center; }
.panel .sub { color:var(--dim); font-size:12.5px; text-align:center; line-height:1.7; }
label { font-size:12.5px; color:var(--dim); display:block; margin-bottom:5px; }
input { width:100%; padding:11px 12px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--text); font-size:15px; font-family:inherit; }
.primary { background:linear-gradient(180deg,#f5c453,#e0a418); color:#23180a; font-weight:700; padding:12px; border:none; border-radius:10px; font-size:15px; width:100%; cursor:pointer; }
#resultBody { text-align:center; font-size:14px; line-height:2; }
#log { font-size:11.5px; color:var(--dim); line-height:1.6; max-height:74px; overflow-y:auto; background:rgba(0,0,0,.18); border-radius:8px; padding:6px 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🀄 青花麻将</h1>
    <div class="info" id="topInfo">万筒条 · 碰杠胡 · <span id="handNo">—</span></div>
    <button class="ghost" id="rulesBtn">玩法</button>
  </header>
  <main>
    <div class="seatrow">
      <div class="seat" id="seat0"><span>🙂 <b class="nm">我</b></span><span class="score">0</span></div>
      <div class="seat" id="seat2"><span>🤖 <b class="nm">AI 乙</b></span><span class="score">0</span></div>
    </div>
    <div class="seatrow">
      <div class="seat" id="seat1"><span>🤖 <b class="nm">AI 甲</b></span><span class="score">0</span><span class="melds"></span></div>
      <div class="seat" id="seat3"><span>🤖 <b class="nm">AI 丙</b></span><span class="score">0</span></div>
    </div>
    <div id="pool"></div>
    <div id="claimBar"></div>
    <div id="log"></div>
  </main>
  <footer>
    <div id="hand"></div>
    <div id="actionBar">
      <button id="btnKong" class="hidden">暗杠</button>
      <button id="btnHu" class="play hidden">胡！</button>
    </div>
  </footer>
</div>

<div class="overlay hidden" id="setup">
  <div class="panel">
    <h2>🀄 青花麻将</h2>
    <p class="sub">仅万筒条 108 张 · 可碰 / 杠 / 胡（无吃）<br>胡牌 = 4 面子 + 对 或 七对 · 自摸 +1 番 · 门清 +1 · 七对 +3 · 碻碰 +2 · 清一色 +4<br>共 4 局，轮庄累计积分</p>
    <div><label>你的昵称</label><input id="myName" maxlength="10" value="你"></div>
    <button id="startBtn" class="primary">开始游戏（对战 3 个 AI）</button>
  </div>
</div>

<div class="overlay hidden" id="result">
  <div class="panel">
    <h2 id="resultTitle">本局结束</h2>
    <div id="resultBody"></div>
    <button id="nextBtn" class="primary">下一局</button>
  </div>
</div>

<script src="js/mj-core.js"></script>
<script src="js/mj-ai.js"></script>
<script src="js/mj-game.js"></script>
<script>
(function () {
  'use strict';
  var C = window.MjCore, Game = window.MjGame, AI = window.MjAI;
  var G = Game.G;
  var $ = function (id) { return document.getElementById(id); };
  var S = { pendingKong: null };

  function toast(m) {
    var el = document.createElement('div');
    el.textContent = m;
    el.style.cssText = 'position:fixed;left:50%;bottom:32%;transform:translateX(-50%);background:rgba(0,0,0,.88);padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;white-space:nowrap;';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1700);
  }
  function tileEl(t, opts) {
    opts = opts || {};
    var el = document.createElement('div');
    var sname = ['万', '筒', '条'][t.suit];
    el.className = 'tile ' + sname;
    if (opts.drawn) el.classList.add('drawn');
    if (opts.canAct) el.classList.add('can-act');
    el.innerHTML = '<span class="r">' + t.rank + '</span><span class="s">' + sname + '</span>';
    if (opts.click) el.addEventListener('click', opts.click);
    return el;
  }

  function render() {
    if (!G.players.length) return;
    for (var seat = 0; seat < 4; seat++) {
      var el = $('seat' + seat);
      var p = G.players[seat];
      el.querySelector('.nm').textContent = p.name + (seat === G.dealer ? '（庄）' : '');
      el.querySelector('.score').textContent = p.score;
      el.classList.toggle('active', G.turn === seat && G.phase === 'playing');
      var meldTxt = p.melds.map(function (m) { return (m.kind === 'kong' ? '杠' : '碰'); }).join('');
      var mEl = el.querySelector('.melds');
      if (mEl) mEl.textContent = meldTxt;
      if (seat === 2 || !mEl) { /* 对家也显示 melds 行 */ }
    }
    // 牌池（最近弃牌）
    var pool = $('pool');
    var seat0 = G.lastDiscard ? G.lastDiscard.seat : 0;
    if (G.lastDiscard) {
      pool.innerHTML = '<span style="color:var(--dim);font-size:12px;">' + G.players[G.lastDiscard.seat].name + ' 打：</span>';
      pool.appendChild(tileEl(G.lastDiscard.tile, {}));
    } else pool.innerHTML = '<span style="color:var(--dim);font-size:12px;">对局进行中…</span>';
    $('handNo').textContent = '第 ' + (G.handNo + 1) + ' / ' + G.maxHands + ' 局 · 牌墙 ' + G.wall.length;
    renderHand(); renderClaims();
  }
  function renderHand() {
    var me = G.players[0];
    var box = $('hand'); box.innerHTML = '';
    if (!me) return;
    var hand = C.sortTiles(me.hand);
    var info = G.humanResolver && G.humanResolver.seat === 0 ? G.humanResolver.info : null;
    hand.forEach(function (t) {
      var isDrawn = G.drawn && t.id === G.drawn.id;
      box.appendChild(tileEl(t, { drawn: isDrawn }));
    });
    // 行动按钮
    var huBtn = $('btnHu'), kongBtn = $('btnKong');
    if (info) {
      huBtn.classList.toggle('hidden', !info.canSelfHu);
      var kongCodes = info.selfKongs || [];
      if (kongCodes.length) {
        kongBtn.classList.remove('hidden');
        kongBtn.textContent = '暗杠 ' + C.SUIT_NAMES[Math.floor(kongCodes[0] / 9)] + ((kongCodes[0] % 9) + 1);
      } else kongBtn.classList.add('hidden');
    } else {
      huBtn.classList.add('hidden'); kongBtn.classList.add('hidden');
    }
  }
  function renderClaims() {
    var bar = $('claimBar');
    bar.innerHTML = '';
    var cr = G.claimResolver;
    if (!cr) return;
    var opts = cr.opts;
    var mk = function (label, kind, cls) {
      var b = document.createElement('button');
      b.textContent = label;
      if (cls) b.className = cls;
      b.addEventListener('click', function () { Game.claimResponse(kind); bar.innerHTML = ''; });
      bar.appendChild(b);
    };
    if (opts.hu) mk('胡！', 'hu', 'hu');
    if (opts.kong) mk('杠', 'kong');
    if (opts.pung) mk('碰', 'pung');
    mk('过', 'pass');
  }

  function startLocal() {
    $('result').classList.add('hidden');
    Game.startGame({
      players: [
        { name: $('myName').value.trim().slice(0, 10) || '你', avatar: '🙂', isHuman: true },
        { name: 'AI 甲', avatar: '🤖', isHuman: false },
        { name: 'AI 乙', avatar: '🤖', isHuman: false },
        { name: 'AI 丙', avatar: '🤖', isHuman: false },
      ],
      maxHands: 4,
    });
    G.hooks.log = function (m, c) {
      var el = document.createElement('div');
      el.textContent = m;
      $('log').appendChild(el);
      $('log').scrollTop = 1e9;
    };
    G.hooks.state = render;
    G.hooks.roundEnd = function (r) {
      setTimeout(function () {
        showResult();
        if (G.waitNextResolve) { var f = G.waitNextResolve; G.waitNextResolve = null; f(); }
      }, 600);
    };
    G.hooks.waitNext = function () {
      return new Promise(function (res) {
        G.waitNextResolve = res;
        $('nextBtn').textContent = (G.handNo + 1 >= G.maxHands) ? '查看总成绩' : '下一局';
      });
    };
    $('log').innerHTML = '';
    render();
    drive();
  }

  /* 驱动整场（碰杠/胡等由引擎 promise 挂起，UI 触发） */
  async function drive() {
    await Game.runFullGame(false);
    if (G.phase === 'gameOver') showFinal();
  }

  function showResult() {
    if (G.phase === 'gameOver') { showFinal(); return; }
    var r = G.roundResult;
    $('hand').innerHTML = '';
    if (r.draw) { $('resultTitle').textContent = '流局'; $('resultBody').innerHTML = '牌墙已尽，本局无人胡牌'; }
    else {
      var winName = G.players[r.winner].name;
      var meWin = r.winner === 0;
      var mine = r.deltas[0];
      $('resultTitle').textContent = winName + (meWin ? '（你）胡牌！' : '胡牌');
      $('resultBody').innerHTML =
        '<div class="' + (meWin ? 'win' : '') + '">' + r.desc + '</div>' +
        '你的得分 <b>' + (mine >= 0 ? '+' : '') + mine + '</b><br>累计积分 ' + G.players[0].score;
    }
    $('result').classList.remove('hidden');
  }
  function showFinal() {
    var order = G.players.map(function (p) { return p; }).sort(function (a, b) { return b.score - a.score; });
    $('resultTitle').textContent = '四 局打完';
    $('resultBody').innerHTML = order.map(function (p, i) {
      return '<div>' + (i === 0 ? '🏆 ' : '') + p.name + ' · ' + p.score + ' 分</div>';
    }).join('') + '<button class="primary" id="restartAll" style="margin-top:8px;">再来一场</button>';
    $('result').classList.remove('hidden');
    $('nextBtn').classList.add('hidden');
    document.getElementById('restartAll').addEventListener('click', function () {
      $('result').classList.add('hidden');
      $('nextBtn').classList.remove('hidden');
      startLocal();
    });
  }

  /* 人类操作 */
  $('btnHu').addEventListener('click', function () { Game.humanHu(0); });
  $('btnKong').addEventListener('click', function () {
    var info = G.humanResolver && G.humanResolver.info;
    if (!info) return;
    var code = info.selfKongs[0];
    Game.humanKong(0, code);
    toast('暗杠');
  });
  $('hand').addEventListener('click', function (e) {
    var tileBox = e.target.closest('.tile');
    if (!tileBox) return;
    if (!G.humanResolver || G.humanResolver.seat !== 0) { toast('还没轮到你'); return; }
    var hand = G.players[0].hand;
    var sorted = C.sortTiles(hand);
    var idx = Array.prototype.indexOf.call($('hand').children, tileBox);
    if (idx < 0 || idx >= sorted.length) return;
    var t = sorted[idx];
    var r = Game.humanDiscard(0, t);
    if (!r.ok) toast('出牌失败');
  });
  $('startBtn').addEventListener('click', startLocal);
  $('nextBtn').addEventListener('click', function () {
    // 单局结束后继续下一局（由 runFullGame 循环控制，正常时不会手动触发）
    $('result').classList.add('hidden');
  });
  $('rulesBtn').addEventListener('click', function () {
    alert('青花麻将（精简规则）\n\n· 仅万 / 筒 / 条 108 张，无风牌花牌\n· 轮流摸牌打牌，可碰 / 杠 / 胡（无吃）\n· 胡牌 = 4 面子 + 1 对，或七对\n· 番数：自摸+1 门清+1 七对+3 碰碰胡+2 清一色+4\n· 点炮者付全部番分，自摸三家各付\n· 4 局轮庄，累计积分');
  });

  $('setup').classList.remove('hidden');
})();
</script>
</body>
</html>
